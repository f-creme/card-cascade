services:
  frontend: 
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.dev
    command: sh -c "npm install && chown 1000:1000 package-lock.json && npm run dev -- --mode dev --host 0.0.0.0"

  backend: 
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    ports:
      - "8000:8000"
    env_file: 
        - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "uv sync --frozen && uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    env_file:
      - ./database/.env.dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  frontend-node-modules:
  backend-venv: